<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaykaEmpoderate | Terapia socioeducativa</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h2>Panel de Pedidos</h2>
            <div>
                <button id="logout-btn" class="btn-logout">Cerrar Sesión</button>
            </div>
        </div>

        <div id="loader" class="loader-container">Cargando pedidos...</div>
        <table id="pedidos-table" style="display: none;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Fecha</th>
                    <th>Cliente & Contacto</th>
                    <th>Detalles de Pago</th>
                    <th>Total</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="pedidos-body">
                <!-- Se rellena con JS -->
            </tbody>
        </table>
    </div>
    
    <!-- El Toast para notificaciones formará parte de styles.css, pero en admin usamos uno nativo rápido o el mismo -->
    <script src="js/admin.js"></script>
</body>
</html>
