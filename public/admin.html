<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MayEduso | Terapia socioeducativa</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script>
        // Prevenir "destello" de la página si no hay token antes de renderizar
        if (!localStorage.getItem('mayka_token')) {
            window.location.replace('login.html');
        }
    </script>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <div style="display: flex; align-items: center;">
                <a href="index.html" class="logo" style="text-decoration: none; font-size: 1.5rem; font-weight: bold; color: #6d28d9;">MayEduso</a>
                <h2 style="margin-left: 1rem; padding-left: 1rem; border-left: 2px solid #ddd; color: #333; font-size: 1.2rem;">Panel de Administración</h2>
            </div>
            <div>
                <button id="logout-btn" class="btn-logout" style="background: #ff6b6b; color: white; border: none; padding: 0.5rem 1rem; border-radius: 5px; cursor: pointer; font-weight: bold;">Cerrar Sesión</button>
            </div>
        </div>

        <div id="loader" class="loader-container">Cargando pedidos...</div>
        <table id="pedidos-table" style="display: none;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Fecha</th>
                    <th>Cliente</th>
                    <th>Email</th>
                    <th>Edad</th>
                    <th>Pago</th>
                    <th>Datos Pago</th>
                    <th>Items</th>
                    <th>Total</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="pedidos-body">
                <!-- Se rellena con JS -->
            </tbody>
        </table>
        <h2 style="margin-top: 3rem; margin-bottom: 1rem; border-bottom: 2px solid #6d28d9; padding-bottom: 0.5rem; color: #333;">Contactos</h2>

<table id="contactos-table">
    <thead>
        <tr>
            <th>Nombre</th>
            <th>Apellidos</th>
            <th>Email</th>
            <th>Mensaje</th>
        </tr>
    </thead>
    <tbody id="contactos-body"></tbody>
</table>
    </div>
    
    <!-- El Toast para notificaciones formará parte de styles.css, pero en admin usamos uno nativo rápido o el mismo -->
    <script src="js/admin.js"></script>
</body>
</html>
