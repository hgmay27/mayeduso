<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaykaEmpoderate | Terapia socioeducativa</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

</head>
<body>
    <header class="site-header">
        <nav class="nav-main">
            <a href="index.html" class="logo">MayEduso</a>
            <ul>
                <li><a href="index.html">Volver a la Web</a></li>
            </ul>
        </nav>
    </header>

    <main class="page-content">
        <div class="login-container">
            <h2>Acceso Administradora</h2>
            <form id="login-form" class="login-form">
                <input type="text" id="username" placeholder="Usuario" required>
                <input type="password" id="password" placeholder="Contraseña" required>
                <button type="submit" class="btn-primary">Entrar</button>
            </form>
            <p id="login-error" class="error-text" style="display:none;"></p>
        </div>
    </main>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errEl = document.getElementById('login-error');
            
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                const data = await res.json();
                
                if (res.ok) {
                    localStorage.setItem('mayka_token', data.token);
                    window.location.href = 'admin.html';
                } else {
                    errEl.innerText = data.error || 'Credenciales inválidas';
                    errEl.style.display = 'block';
                }
            } catch (err) {
                errEl.innerText = 'Error de conexión con el servidor.';
                errEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
